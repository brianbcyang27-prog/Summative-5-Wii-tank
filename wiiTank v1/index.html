<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>tank game</title>
        <link rel="stylesheet" type="text/css" href="style.css">
        <script src="main.js" defer></script>
    </head>
    <body>
        <main id="introPanel" aria-label="Tank game start screen">
            <div class="menu-card">
                <p class="eyebrow">arcade survival</p>
                <h1 id="introTitle">Tank Game</h1>


                <div class="control-row" aria-label="Game controls">
                    <span><strong>WASD</strong> Move</span>
                    <span><strong>Mouse</strong> Aim</span>
                    <span><strong>Click</strong> Shoot</span>
                </div>

                <button id="gameStartButton">start</button>
            </div>

            <div class="mini-tank mini-tank-left" aria-hidden="true">
                <span></span>
            </div>
            <div class="mini-tank mini-tank-right" aria-hidden="true">
                <span></span>
            </div>
        </main>
    </body>
</html>
